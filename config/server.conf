# ============================================================================
# FTP Server Configuration — v2.0
# ============================================================================

# Network
port = 21
root_dir = ftproot

# User credentials file
users_file = config/users.conf

# Concurrency
thread_pool_size = 8
max_clients = 100

# ── Security ────────────────────────────────────────────────────────────────
timeout_secs = 300
max_file_size_mb = 100
allow_anonymous = no

# ── Performance ─────────────────────────────────────────────────────────────
# Bandwidth limit per connection in KB/s (0 = unlimited)
bandwidth_limit_kbps = 0

# Socket buffer sizes (increase for high-throughput LAN transfers)
send_buf_kb = 256
recv_buf_kb = 64

# ── Logging & Control ───────────────────────────────────────────────────────
log_level = info
log_file = ftp_server.log
admin_port = 8080
